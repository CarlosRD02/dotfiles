# Kitty conf Krlos

# Font
font_family Meslo LGS Nerd Font
font_size 11
font_style Regular

hide_window_decorations no
#enabled_layouts Splits
sync_to_monitor no

#allow_remote_control socket
#listen_on unix:/tmp/kitty-control

# Opacidad
background_opacity 0.85
dynamic_background_opacity yes

# Scrollback
#scrollback_lines 1000

# Tab Bar
tab_bar_edge top
tab_bar_style custom
# tab bar styles: fade, slant, separator, powerline, custom, hiden
tab_powerline_style round
# angled, slated, round

# Notifications
notify_on_cmd_finish invisible
# never, unfocused, invisible, always

# Cursor
cursor_trail 100
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_shape block
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

enable_audio_bell yes

# Atajo principal (modificador) - por defecto Ctrl+Shift
kitty_mod ctrl+shift

# Habilitar layouts para organizar ventanas
enable_layouts splits
#enable_layouts tall, stack,fat,grid,splits,horizontal,vertical

# Shell a usar (puede ser bash, zsh, etc.)
#shell zsh

# Directorio de Inicio
#kitty -d ~/Proyectos/

# Atajos de Teclado 
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# Alternar pestañas con ctrl+tab / ctrl+shift+tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Otras cosas útiles
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+q kill_tab

map ctrl+shift+j next_window
map ctrl+shift+k previous_window

#map ctrl+shift+j launch --location=hsplit --type=window
#map ctrl+shift+k launch --location=vsplit

#map alt+ESC launch --location=overlay

# Tamano de Inicio
remember_window_size  no
initial_window_width 95c
initial_window_height 26c
11
# BEGIN_KITTY_THEME
# Nord
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
#font_family      family="Cascadia Code"
#bold_font        auto
#italic_font      auto
#bold_italic_font auto
# END_KITTY_FONTS
